server:
  port: 8080

spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  application:
    name: Application-Protocol-Lab
  graphql:
    graphiql:
      enabled: true
      path: /graphiql
    schema:
      printer:
        enabled: true

# Phase 5: gRPC Server & Client Configuration
grpc:
  server:
    port: 9090
  client:
    orderService:
      address: 'static://localhost:9090'
      negotiationType: PLAINTEXT

logging:
  level:
    root: INFO
    com.protocol.lab: DEBUG
    org.springframework.web: INFO
    io.grpc: INFO
    net.devh.boot.grpc: INFO
