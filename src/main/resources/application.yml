server:
  port: 8080

spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  application:
    name: Application-Protocol-Lab
  graphql:
    graphiql:
      enabled: true
      path: /graphiql
    schema:
      printer:
        enabled: true

logging:
  level:
    root: INFO
    com.protocol.lab: DEBUG
    org.springframework.web: INFO
